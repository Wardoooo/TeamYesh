<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Piso WiFi — Code</title>
  <link rel="stylesheet" href="css/naive.css">
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div>type ur code part</div>
      <a href="page2.html">close</a>
    </div>

    <div class="code-page">
      <h1>Welcome to PISO WIFI from HELL</h1>
      <div class="prompt">enter your code to start browsing</div>

      <form class="letters" autocomplete="off">
        <input maxlength="1" value="H" aria-label="code letter 1">
        <input maxlength="1" value="I" aria-label="code letter 2">
        <input maxlength="1" value="W" aria-label="code letter 3">
        <input maxlength="1" value="O" aria-label="code letter 4">
        <input maxlength="1" value="R" aria-label="code letter 5">
        <input maxlength="1" value="L" aria-label="code letter 6">
        <input maxlength="1" value="D" aria-label="code letter 7">
      </form>

      <label class="terms">
        <input type="checkbox">
        terms and condition
      </label>

      <div>
        <a class="skip-btn" href="page4.html">skip</a>
      </div>
      <p class="note">temporary skip — code and terms are not checked yet</p>
    </div>
  </div>
  <script type="module" src="pages/chat.js"></script>
</body>
</html>
