<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Piso WiFi — Machine</title>
  <link rel="stylesheet" href="purse.css">
</head>
<body>
  <div class="tools" id="tools"></div>
  <main class="stage">
    <img src="../assets/img/5.png" alt="YESH NA YESH Piso WiFi machine and rates">
    <div class="led" id="led" aria-live="polite">
      <div>YESH NA YESH WIFI</div>
      <div class="code" id="led-code" hidden></div>
      <div id="led-time">PHP 0.00 = 0:00</div>
    </div>
    <div class="slot" id="slot" aria-label="Coin slot"></div>
    <div class="peso p1" data-amount="1" role="button" aria-label="One peso from the tarpaulin. Sixty seconds until the total reaches five pesos.">₱1</div>
    <div class="peso p5" data-amount="5" role="button" aria-label="Five peso coin. Three minutes.">₱5</div>
    <div class="peso p10" data-amount="10" role="button" aria-label="Ten peso coin. Five minutes.">₱10</div>
    <button type="button" class="connect" id="connect">connect</button>
  </main>
  <p class="toast"></p>
  <script type="module" src="purse.js"></script>
  <script type="module" src="chat.js"></script>
</body>
</html>
